services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: ai-rag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  postgres:
    image: postgres:17
    container_name: ai-rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_rag
    ports:
      - "5433:5432"
    volumes:
      - postgres_storage:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ai-rag-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_storage:/data
    command: redis-server --appendonly yes

volumes:
  qdrant_storage:
  postgres_storage:
  redis_storage:
